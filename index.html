        // --- SIGNATURE PAD ---
        class SignaturePad extends React.Component {
            constructor(props) {
                super(props);
                this.canvasRef = React.createRef();
                this.isDrawing = false;
                this.hasContent = false;
                this.ctx = null;
            }

            componentDidMount() {
                this.initCanvas();
                window.addEventListener('resize', this.handleResize);
            }

            componentWillUnmount() {
                window.removeEventListener('resize', this.handleResize);
            }

            initCanvas = () => {
                const canvas = this.canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                this.ctx = canvas.getContext('2d');
                this.setupContext();
            }

            setupContext = () => {
                if (this.ctx) {
                    this.ctx.lineWidth = 2;
                    this.ctx.lineCap = 'round';
                    this.ctx.lineJoin = 'round';
                    this.ctx.strokeStyle = '#000000';
                }
            }

            handleResize = () => this.initCanvas();

            startDrawing = (e) => {
                const { offsetX, offsetY } = this.getCoordinates(e);
                this.ctx.beginPath();
                this.ctx.moveTo(offsetX, offsetY);
                this.isDrawing = true;
                this.hasContent = true;
            }

            draw = (e) => {
                if (!this.isDrawing) return;
                const { offsetX, offsetY } = this.getCoordinates(e);
                this.ctx.lineTo(offsetX, offsetY);
                this.ctx.stroke();
            }

            stopDrawing = () => {
                if (this.isDrawing) {
                    this.ctx.closePath();
                    this.isDrawing = false;
                }
            }

            getCoordinates = (e) => {
                const canvas = this.canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { offsetX: clientX - rect.left, offsetY: clientY - rect.top };
            }

            clear = () => {
                const canvas = this.canvasRef.current;
                this.ctx.clearRect(0, 0, canvas.width, canvas.height);
                this.hasContent = false;
            }

            isEmpty = () => !this.hasContent;
            getTrimmedCanvas = () => this.canvasRef.current;

            render() {
                return (
                    <canvas
                        ref={this.canvasRef}
                        className="w-full h-full cursor-crosshair block touch-none"
                        onMouseDown={this.startDrawing}
                        onMouseMove={this.draw}
                        onMouseUp={this.stopDrawing}
                        onMouseLeave={this.stopDrawing}
                        onTouchStart={this.startDrawing}
                        onTouchMove={this.draw}
                        onTouchEnd={this.stopDrawing}
                    />
                );
            }
        }

        // --- USER REQUEST FORM COMPONENT ---
        const UserRequestForm = ({ items, onSubmit, formType }) => {

            // Logic untuk memproses item setelah scan atau manual input
            const processAddItem = (codeToAdd) => {
                const foundItem = items.find(i => 
                    (i.code && i.code.toLowerCase() === codeToAdd.toLowerCase()) || 
                    (i.name && i.name.toLowerCase() === codeToAdd.toLowerCase()) ||

                if (foundItem) {
                    const newItem = {
                        type: 'master',
                        itemId: foundItem.id,
                        code: foundItem.code || '-',
                        name: foundItem.name,
                        qty: parseInt(qty) || 1,
                        price: foundItem.price || 0,
                        unit: foundItem.unit || '-'

                        qty: parseInt(qty) || 1, 
                        price: selectedMasterItem.price || 0, 
                        unit: selectedMasterItem.unit || '-'

                } else if (inputMode === 'scan') {
                    if (!scanCode) return alert('Kode scan kosong');

                    if (success) {
                         scanInputRef.current?.focus();

            const handleScanKeyDown = (e) => {

                        </select>

                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>

                        </div>
                    </div>
                    
                    {!isWithdrawal && (
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Periode Pengajuan</label>
                            <select className="w-full border rounded-lg p-2.5" value={period} onChange={(e) => setPeriod(e.target.value)}>
                            <option value="">-- Pilih Periode --</option>
                            {months.map((m) => <option key={m} value={`${m} ${new Date().getFullYear()}`}>{m} {new Date().getFullYear()}</option>)}
                            </select>
                        </div>
                    )}
                    </div>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <div className="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Package size={20} className={`text-${themeColor}-600`}/> Rincian Barang</h3>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-gray-50 p-4 rounded-lg">
                    
                    <div className="md:col-span-12 flex flex-wrap gap-2 mb-2">
                        <button onClick={() => { setInputMode('master'); setQty(1); }} className={`px-3 py-1.5 text-sm rounded-full flex items-center gap-1 ${inputMode === 'master' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600'}`}><Search size={14}/> Cari Manual</button>
                        
                        {isWithdrawal && <button onClick={() => { setInputMode('scan'); setQty(1); setShowScanner(true); }} className={`px-3 py-1.5 text-sm rounded-full flex items-center gap-1 ${inputMode === 'scan' ? 'bg-orange-600 text-white' : 'bg-gray-200 text-gray-600'}`}><QrCode size={14}/> Scan QR Code</button>}
                        
                        <button onClick={() => { setInputMode('manual'); setQty(1); }} className={`px-3 py-1.5 text-sm rounded-full flex items-center gap-1 ${inputMode === 'manual' ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-600'}`}><Plus size={14}/> Input Baru</button>
                    </div>

                    {inputMode === 'master' && (
                        <>
                        <div className="md:col-span-6">
                            <label className="block text-xs font-bold text-gray-500 uppercase">Pilih Barang</label>
                            <select className="w-full border rounded-lg p-2.5 bg-white" value={selectedItemId} onChange={(e) => setSelectedItemId(e.target.value)}>
                            <option value="">-- Cari Barang --</option>
                            {items.map(i => <option key={i.id} value={i.id}>{i.code ? `[${i.code}] ` : ''}{i.name} ({i.unit})</option>)}
                            </select>
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Stok</label>

                        </>
                    )}

                    {inputMode === 'scan' && (
                        <>
                        <div className="md:col-span-6">

                            <div className="flex gap-2">
                                <div className="relative flex-1">
                                    <input ref={scanInputRef} type="text" className="w-full border-2 border-orange-300 rounded-lg p-2.5 pl-9 outline-none focus:border-orange-500" placeholder="Scan disini..." value={scanCode} onChange={(e) => setScanCode(e.target.value)} onKeyDown={handleScanKeyDown}/>

                    {inputMode === 'manual' && (

                        </div>

                    <div className="md:col-span-2">
                        <button onClick={handleAddItem} className={`w-full bg-${themeColor}-600 hover:bg-${themeColor}-700 text-white p-2.5 rounded-lg font-medium flex items-center justify-center gap-2`}><Plus size={18}/> Tambah</button>

                            </thead>
                            <tbody>
                            {requestList.map((item, idx) => (
                                <tr key={idx} className="border-b last:border-0 hover:bg-gray-50">
                                <td className="px-4 py-3 text-center">{idx + 1}</td>
                                <td className="px-4 py-3 font-mono text-blue-600">{item.code || '-'}</td>
                                <td className="px-4 py-3 font-medium">{String(item.name)} {item.type === 'manual' && <span className="ml-2 text-xs bg-orange-100 text-orange-700 px-1 rounded">Manual</span>}</td>
                                <td className="px-4 py-3 text-center font-bold">{Number(item.qty)}</td>
                                <td className="px-4 py-3 text-right"><button onClick={() => {const nl=[...requestList];nl.splice(idx,1);setRequestList(nl)}} className="text-red-500"><Trash2 size={18}/></button></td>
                                </tr>
                            ))}
                            </tbody>
                        </table>
                        </div>
                    )}
                    </div>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><Edit size={20} className={`text-${themeColor}-600`}/> Tanda Tangan {isWithdrawal ? 'Pengambil' : 'Pemohon'}</h3>
                    <div className="border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 relative h-48 w-full md:w-96 mx-auto">
                    <SignaturePad ref={sigCanvas} />
                    <button onClick={clearSignature} className="absolute top-2 right-2 bg-white p-1 shadow rounded text-gray-500 hover:text-red-500"><Eraser size={16}/></button>
                    <div className="absolute bottom-2 left-0 right-0 text-center pointer-events-none text-xs text-gray-400">Area Tanda Tangan</div>
                    </div>
                </div>

                <div className="flex justify-end gap-4">
                    <button className="px-6 py-3 rounded-lg text-gray-600 hover:bg-gray-100 font-medium">Batal</button>
                    <button onClick={handleSubmit} disabled={loading} className={`px-8 py-3 rounded-lg bg-${themeColor}-600 hover:bg-${themeColor}-700 text-white font-bold shadow-lg flex items-center gap-2 ${loading ? 'opacity-50 cursor-not-allowed' : ''}`}>
                    {loading ? 'Menyimpan...' : <><Save size={20}/> Simpan & Cetak</>}
                    </button>
                </div>
                </div>
            );
        };

        // --- USER TRANSACTION HISTORY ---
        const UserTransactionHistory = ({ requests, onViewPdf }) => (
            <div className="bg-white p-6 rounded-xl shadow-sm">
                <h2 className="text-xl font-bold mb-6">Riwayat Saya</h2>
                <div className="space-y-4">
                {requests.length === 0 ? <p className="text-gray-400">Belum ada data.</p> : null}
                {requests.map(req => (
                    <div key={req.id} className="border p-4 rounded-lg flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <div className="flex items-center gap-2">
                            <span className={`px-2 py-0.5 text-xs rounded font-bold ${req.status === 'Approved' ? 'bg-green-100 text-green-700' : req.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>{req.status}</span>
                            {req.type === 'withdrawal' && <span className="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded font-bold">Pengambilan</span>}
                            <span className="text-gray-500 text-sm">#{req.id.slice(0, 6)}</span>
                        </div>
                        <p className="font-bold mt-1">{req.items ? req.items.length : 0} Barang</p>
                        <p className="text-xs text-gray-400">{req.date}</p>
                    </div>
                    <button onClick={() => onViewPdf(req)} className="text-blue-600 hover:underline text-sm flex items-center gap-1"><FileText size={16}/> Dokumen</button>
                    </div>
                ))}
                </div>
            </div>
        );

        // --- MAIN APP ---
        function App() {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([]);
            const [requests, setRequests] = useState([]);
            // DEFAULT VIEW: Pengambilan (Public)
            const [activeView, setActiveView] = useState('user-withdrawal');
            const [isSidebarOpen, setSidebarOpen] = useState(false);
            const [notification, setNotification] = useState(null);
            const [printData, setPrintData] = useState(null);
            
            // Login State
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            // Config State
            const [appConfig, setAppConfig] = useState({
                email: '',
                adminUser: 'admin',
                adminPass: 'admin123',
                staffUser: 'staff',    // Default Staff User
                staffPass: 'staff123'  // Default Staff Pass
            });

            const showNotification = (msg, type = 'success') => {
                setNotification({ message: msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            // Auth
            useEffect(() => {
                const init = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error(e); }
                };
                init();
                return onAuthStateChanged(auth, setUser);
            }, []);

            // Data Sync (Read Only for Items)
            useEffect(() => {
                if (!user) return;
                const unsubItems = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'items'), s => setItems(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''))));
                const unsubReq = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), s => setRequests(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date))));
                
                // Load App Config
                const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'general_settings'), (docSnap) => {
                    if (docSnap.exists()) {
                        setAppConfig(docSnap.data());
                    } else {
                        // Default config if not exists
                        setAppConfig({ 
                            email: '', 
                            adminUser: 'admin', 
                            adminPass: 'admin123',
                            staffUser: 'staff',
                            staffPass: 'staff123'
                        });
                    }
                });

                return () => { unsubItems(); unsubReq(); unsubConfig(); };
            }, [user]);

            const handleSaveConfig = async (newConfig) => {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'general_settings'), newConfig);
                    showNotification('Konfigurasi Berhasil Disimpan!');
                } catch (e) {
                    showNotification('Gagal menyimpan konfigurasi', 'error');
                }
            };
            
            // Auto-Add Manual items to Master & Submit
            const handleUserSubmit = async (formData) => {
                if (!user) return;
                try {
                    // 1. Process Data
                    const processedItems = await Promise.all(formData.items.map(async (item) => {
                        if (item.type === 'manual') {
                            const existingItem = items.find(i => (i.name || '').toLowerCase() === (item.name || '').toLowerCase());
                            if (existingItem) {
                                return { ...item, type: 'master', itemId: existingItem.id, code: existingItem.code, unit: existingItem.unit || 'Pcs', price: existingItem.price || 0 };
                            } else {
                                try {
                                    const newCode = `MAN-${Date.now().toString().slice(-6)}`;
                                    const newItemData = {
                                        name: item.name, code: newCode, stock: 0, unit: 'Pcs', price: 0, category: 'Umum', createdAt: new Date().toISOString(), minStock: 5
                                    };
                                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), newItemData);
                                    return { ...item, type: 'master', itemId: docRef.id, code: newCode, unit: 'Pcs', price: 0 };
                                } catch (err) { return item; }
                            }
                        }
                        return item;
                    }));

                    const newRequest = {
                        type: formData.formType, date: formData.date, period: formData.period,
                        createdAt: new Date().toISOString(), userId: user.uid,
                        userName: formData.name, department: formData.department,
                        items: processedItems, signature: formData.signature, status: 'Pending'
                    };

                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), newRequest);
                    setPrintData({ id: docRef.id, ...newRequest }); 
                    
                    // --- LOGIKA EMAIL MANUAL (Mailto) ---
                    // Jika ini adalah 'request' (Form Permintaan) dan ada email tujuan di config
                    if (formData.formType === 'request' && appConfig.email) {
                        
                        const itemsList = processedItems.map((i, idx) => `${idx+1}. ${i.name} (${i.qty} ${i.unit})`).join('\n');
                        const emailSubject = `Permintaan Barang Baru: ${newRequest.userName} (${newRequest.department})`;
                        const emailBody = `Halo Admin,\n\nAda permintaan barang baru:\n\nNama: ${newRequest.userName}\nDepartemen: ${newRequest.department}\nTanggal: ${newRequest.date}\n\nList Item:\n${itemsList}\n\nSilakan cek portal untuk detailnya.`;
                        
                        // Buka draft email default
                        window.open(`mailto:${appConfig.email}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`);
                        
                        // Trigger Print Dialog
                        setTimeout(() => {
                           window.print();
                        }, 1000);
                        showNotification(`Data tersimpan. Draft email & dialog cetak dibuka.`);
                        
                    } else {
                        showNotification('Terkirim & Master Data Diupdate!');
                    }

                } catch (e) { showNotification('Gagal mengirim: ' + e.message, 'error'); }
            };
            
            // NAVIGATION HANDLER
            const handleNavClick = (view) => {
                if (view === 'user-withdrawal' || view === 'settings') {
                    // Public Access (Settings has its own internal login)
                    setActiveView(view);
                } else {
                    // Protected Access
                    if (isLoggedIn) {
                        setActiveView(view);
                    } else {
                        setActiveView('login');
                    }
                }
                setSidebarOpen(false);
            };

            const handleLoginSuccess = () => {
                setIsLoggedIn(true);
                setActiveView('user-form'); // Default redirect after login
            };

            if (printData) return <PrintView data={printData} onClose={() => {setPrintData(null); setActiveView(isLoggedIn ? 'user-transactions' : 'user-withdrawal')}} />;

            return (
                <div className="flex h-screen bg-gray-50 text-gray-800 font-sans overflow-hidden">
                    {/* Sidebar */}
                    <aside className={`bg-slate-900 text-white transition-all duration-300 ease-in-out flex flex-col shadow-xl z-20 absolute md:relative h-full ${isSidebarOpen ? 'w-64' : 'w-0 md:w-20'}`}
                        onMouseEnter={() => window.innerWidth >= 768 && setSidebarOpen(true)}
                        onMouseLeave={() => window.innerWidth >= 768 && setSidebarOpen(false)}
                    >
                        <div className="p-4 border-b border-slate-700 flex justify-between items-center">
                             {(isSidebarOpen || window.innerWidth >= 768) && <h1 className={`font-bold text-xl tracking-wider text-blue-400 whitespace-nowrap transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'md:opacity-0'}`}>USER MENU</h1>}
                            <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-1 hover:bg-slate-700 rounded md:hidden"><X size={20}/></button>
                        </div>
                        <nav className="flex-1 py-6 space-y-1 overflow-y-auto no-scrollbar">
                            <NavItem icon={<ClipboardList size={20}/>} label="Pengambilan" isActive={activeView==='user-withdrawal'} onClick={()=>handleNavClick('user-withdrawal')} isOpen={isSidebarOpen} />
                            <NavItem icon={<FileText size={20}/>} label="Permintaan" isActive={activeView==='user-form'} onClick={()=>handleNavClick('user-form')} isOpen={isSidebarOpen} isLocked={!isLoggedIn} />
                            <NavItem icon={<History size={20}/>} label="Riwayat Saya" isActive={activeView==='user-transactions'} onClick={()=>handleNavClick('user-transactions')} isOpen={isSidebarOpen} isLocked={!isLoggedIn} />
                            
                            <div className="mt-8 pt-4 border-t border-slate-700">
                                <NavItem icon={<Settings size={20}/>} label="Pengaturan" isActive={activeView==='settings'} onClick={()=>handleNavClick('settings')} isOpen={isSidebarOpen} />
                            </div>
                        </nav>
                        <div className="p-4 border-t border-slate-700">
                            <div className={`flex items-center ${!isSidebarOpen && 'justify-center'}`}>
                                <div className="w-8 h-8 rounded-full flex items-center justify-center font-bold bg-orange-500">U</div>
                                {isSidebarOpen && <div className="ml-3"><p className="text-sm font-medium">User Access</p><div className="flex items-center gap-1 text-xs text-green-400"><Wifi size={10}/> Online</div></div>}
                            </div>
                        </div>
                    </aside>
                    
                    {/* Main Content */}
                    <main className="flex-1 flex flex-col overflow-hidden relative w-full">
                        <header className="h-16 bg-white border-b flex items-center justify-between px-4 md:px-6 shadow-sm z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="md:hidden p-1 text-gray-600"><Menu size={24}/></button>
                                <h2 className="text-lg font-semibold text-gray-700">
                                    {activeView === 'user-withdrawal' ? 'Form Pengambilan (Umum)' : 
                                     activeView === 'login' ? 'Login Staff' :
                                     activeView === 'settings' ? 'Pengaturan Sistem' :
                                     activeView === 'user-form' ? 'Form Permintaan (Staff)' : 'Riwayat Pengajuan'}
                                </h2>
                            </div>
                            {isLoggedIn ? 
                                <button onClick={() => {setIsLoggedIn(false); setActiveView('user-withdrawal');}} className="text-gray-500 hover:text-red-600 p-2 flex items-center gap-2" title="Keluar">
                                    <span className="text-xs font-bold hidden md:inline">Logout</span> <LogOut size={20}/>
                                </button> : 
                                <div className="text-xs text-gray-400 italic">Guest Mode</div>
                            }
                        </header>
                        
                        <div className="flex-1 overflow-auto p-4 md:p-6 bg-gray-50">
                            {activeView === 'login' && <LoginScreen onLogin={handleLoginSuccess} staffCredentials={{user: appConfig.staffUser, pass: appConfig.staffPass}} />}
                            {activeView === 'user-form' && <UserRequestForm items={items} onSubmit={handleUserSubmit} formType="request"/>}
                            {activeView === 'user-withdrawal' && <UserRequestForm items={items} onSubmit={handleUserSubmit} formType="withdrawal"/>}
                            {activeView === 'user-transactions' && <UserTransactionHistory requests={requests} onViewPdf={(req)=>setPrintData(req)}/>}
                            {activeView === 'settings' && <SettingsScreen currentConfig={appConfig} onSaveConfig={handleSaveConfig}/>}
                        </div>

                        <footer className="bg-white border-t py-3 px-6 text-center text-xs text-gray-400">
                            &copy; 2026 Direktorat Operation - Dept Operational Support
                        </footer>
                    </main>
                    
                    {notification && <div className={`fixed bottom-5 right-5 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>{notification.message}</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
